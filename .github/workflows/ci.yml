# CI: everything `pnpm test` and the Python suite check locally, on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - name: Tests (database tests on in-process PGlite)
        run: pnpm test
      - name: Tests (database tests on Postgres 16)
        run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Simulator (seeded bot-only matches, invariant audit)
        run: pnpm sim --matches 1000 --mode both
      - name: Server bundle
        run: pnpm --filter @canutell/server build

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install uv==0.11.32
      - run: uv sync --frozen
      - run: uv run pytest -q
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t canutell-server .
      - run: docker build -f services/agents/Dockerfile -t canutell-agents .
