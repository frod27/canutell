# CANUTELL game server on Fly.io (docs/ALPHA.md). Deploy from the repo root:
#   fly deploy --config fly.server.toml
# Secrets (never in this file): fly secrets set --app canutell-server DATABASE_URL=… AGENT_SERVICE_SECRET=…
# Matches live in memory: keep exactly ONE machine (deploy with --ha=false) and deploy outside game nights.

app = "canutell-server"
primary_region = "mad"

[build]
  dockerfile = "apps/server/Dockerfile"

# Apply pending migrations (supabase/migrations, bundled in the image) before each release goes live. The
# server refuses to start with pending migrations, so without this the first deploy would never pass its
# health check. Only approved, numbered migrations exist in the repo (CLAUDE.md).
[deploy]
  release_command = "node dist/db-cli.mjs migrate"

[env]
  PORT = "8787"
  HOST = "::"
  ACCOUNTS_ONLY = "1"
  INVITES_REQUIRED = "1"
  ALPHA = "1"
  GAME_NIGHTS = "Tue,Thu,Sun 20:00-22:00 Europe/Madrid"
  # canutell.com is the one web origin (www redirects to it); passkeys are bound to this domain for good.
  WEBAUTHN_RP_ID = "canutell.com"
  WEBAUTHN_ORIGINS = "https://canutell.com"
  CORS_ORIGIN = "https://canutell.com"
  AGENT_SERVICE_URL = "http://canutell-agents.internal:8790"
  AGENT_CALLBACK_URL = "ws://canutell-server.internal:8787"
  # Agent Studio (Phase 7): turn on ("1") only after the first 100 baseline-only alpha matches, so H has a clean
  # baseline. Makers can build agents before that; they just aren't seated.
  STUDIO = "0"
  STUDIO_SHARE = "0.5"

[http_service]
  internal_port = 8787
  force_https = true
  # Never stop the machine: it holds running matches and their timers.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "15s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
